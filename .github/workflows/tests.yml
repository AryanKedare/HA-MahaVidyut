name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python tools/build_standalone.py --check
      - run: ruff check tools/build_standalone.py tools/maha_vidyut_test.py
      - run: ruff format --check tools/build_standalone.py tools/maha_vidyut_test.py
      - run: python -m pytest -q
